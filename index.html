<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>VirtualShoppingWorld</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6ef;font-family:system-ui,-apple-system,Arial,sans-serif;color:#fff;touch-action:none}
#game{position:absolute;inset:0}
canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{background:#111827eF;border:1px solid #ffffff35;border-radius:15px;padding:9px 12px;backdrop-filter:blur(10px);font-size:12px;box-shadow:0 5px 22px #0003}
#title{font-weight:850;font-size:15px;letter-spacing:.3px}
#sub{opacity:.78;font-size:11px;margin-top:2px}
#status{text-align:right;white-space:nowrap}
#storeCount{position:absolute;top:75px;right:10px;max-width:60%;text-align:right}
#bottom{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#joystick{pointer-events:auto;width:124px;height:124px;flex:0 0 124px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff85;position:relative;touch-action:none;box-shadow:0 5px 24px #0003}
#knob{width:48px;height:48px;border-radius:50%;background:#edf5ffeb;border:2px solid #fff;position:absolute;left:36px;top:36px;box-shadow:0 3px 12px #0002}
.actions{pointer-events:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
button{border:1px solid #ffffff70;background:#17263eef;color:white;border-radius:14px;padding:12px 14px;font-weight:800;font-size:12px;box-shadow:0 4px 18px #0003;touch-action:manipulation}
button:active{transform:scale(.975)}
#shopPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,91vw);max-height:76vh;overflow:auto;background:#101a2af5;border:1px solid #ffffff50;border-radius:20px;padding:17px;display:none;pointer-events:auto;box-shadow:0 18px 60px #0009}
#shopPanel h2{font-size:20px;margin:0 0 5px}
#shopPanel p{font-size:13px;opacity:.82;line-height:1.45;margin:0}
#items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.item{background:linear-gradient(145deg,#ffffff18,#ffffff0a);border:1px solid #ffffff27;border-radius:13px;padding:10px;font-size:12px;min-width:0}
.item .swatch{height:26px;border-radius:7px;margin-bottom:7px;border:1px solid #ffffff30}
.item b{display:block;margin-bottom:4px}
.item button{width:100%;padding:8px 5px;margin-top:7px;font-size:11px}
#hint{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);background:#101827d9;padding:8px 12px;border-radius:12px;font-size:11px;white-space:nowrap;max-width:92vw;text-align:center}
#toast{position:absolute;top:calc(75px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#087f65;color:white;padding:9px 14px;border-radius:12px;display:none;font-size:12px;font-weight:800;box-shadow:0 4px 20px #0003}
#cartPanel{position:absolute;right:10px;top:calc(124px + env(safe-area-inset-top));width:min(320px,88vw);max-height:48vh;overflow:auto;background:#101a2af5;border:1px solid #ffffff40;border-radius:16px;padding:14px;display:none;pointer-events:auto;box-shadow:0 14px 40px #0008}
#cartPanel h3{margin:0 0 8px;font-size:17px}
.cartline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff20;font-size:12px}
.cartline button{padding:3px 8px;margin-left:5px}
#cartToggle{pointer-events:auto;cursor:pointer}
@media(min-width:700px){#joystick{width:145px;height:145px;flex-basis:145px}#knob{left:45px;top:45px}#title{font-size:18px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="pill"><div id="title">VIRTUAL SHOPPING WORLD</div><div id="sub">Explore • Discover • Shop</div></div>
    <button id="cartToggle" class="pill">🛒 Cart: <b id="cartCount">0</b><br><span id="cartTotal">₹0</span></button>
  </div>
  <div id="storeCount" class="pill">4 stores • 16 products</div>
  <div id="hint">Move with joystick • Drag the world to look around • Walk to a shop</div>
  <div id="toast"></div>
  <div id="cartPanel"><h3>Your shopping cart</h3><div id="cartLines"></div><div id="cartGrand" style="font-weight:800;margin:10px 0">Total: ₹0</div><button id="clearCart" style="width:100%">CLEAR CART</button></div>
  <div id="bottom">
    <div id="joystick"><div id="knob"></div></div>
    <div class="actions"><button id="interact">OPEN NEAREST SHOP</button><button id="viewBtn">RESET VIEW</button></div>
  </div>
  <div id="shopPanel"><h2 id="shopName">Shop</h2><p id="shopDesc">Browse products in this store.</p><div id="items"></div><button id="closeShop" style="width:100%">CONTINUE EXPLORING</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xc6dce9);
scene.fog=new THREE.Fog(0xc6dce9,34,82);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xf1f8ff,0x677586,2.15));
const sun=new THREE.DirectionalLight(0xffe5c0,2.4);
sun.position.set(-10,18,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;
scene.add(sun);
const fill=new THREE.PointLight(0xa7ddff,35,45);fill.position.set(0,7,0);scene.add(fill);
const warm=new THREE.PointLight(0xffd59b,22,25);warm.position.set(-12,6,-8);scene.add(warm);
const warm2=new THREE.PointLight(0xffd59b,22,25);warm2.position.set(12,6,8);scene.add(warm2);

function mat(color,roughness=.72,metalness=0,extra={}){return new THREE.MeshStandardMaterial({color,roughness,metalness,...extra})}
const M={
 floor:mat(0xe0e6e9,.3,.08),tile:mat(0xc1cbd3,.58),wall:mat(0xe8edf1,.82),
 dark:mat(0x253346,.55),steel:mat(0x8796a4,.38,.65),
 glass:mat(0x8bd8f3,.16,.25,{transparent:true,opacity:.42}),
 gold:mat(0xe9b85d,.32,.25),wood:mat(0x956c4d,.6),
 red:mat(0xd64c57,.48),blue:mat(0x377bd1,.42),green:mat(0x299875,.48),
 white:mat(0xffffff,.55),black:mat(0x202631,.7),leaf:mat(0x28885b,.7),
 skin:mat(0xd6a17c,.8),shirt:mat(0x245dc5,.65),pants:mat(0x263449,.7),shoe:mat(0xf6f7f8,.45)
};
function addBox(parent,w,h,d,material,x,y,z,cast=true,receive=true){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);mesh.castShadow=cast;mesh.receiveShadow=receive;parent.add(mesh);return mesh;
}
function makeTextTexture(text,bg='#16243a',fg='#ffffff'){
 const c=document.createElement('canvas');c.width=768;c.height=160;
 const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle=fg;ctx.font='800 54px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(text,c.width/2,c.height/2,730);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
function labelPlane(text,w,h,bg='#16243a'){
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:makeTextTexture(text,bg),side:THREE.DoubleSide}));
 return mesh;
}

// Mall base and tile floor.
addBox(scene,48,.5,48,M.floor,0,-.3,0,false);
const tileLines=new THREE.Group();scene.add(tileLines);
for(let p=-23;p<=23;p+=2){
 const v=new THREE.Mesh(new THREE.BoxGeometry(.018,.008,46),M.tile);v.position.set(p,-.035,0);tileLines.add(v);
 const h=new THREE.Mesh(new THREE.BoxGeometry(46,.008,.018),M.tile);h.position.set(0,-.035,p);tileLines.add(h);
}
// Main polished central aisle.
addBox(scene,9,.025,43,mat(0xb8dce6,.2,.15),0,-.025,0,false);
// Side and rear walls with lower stone trim; keep front open.
addBox(scene,48,5.8,.6,M.wall,0,2.6,-23.5,false);
addBox(scene,.6,5.8,48,M.wall,-23.5,2.6,0,false);
addBox(scene,.6,5.8,48,M.wall,23.5,2.6,0,false);
addBox(scene,48,.35,.8,M.dark,0,.2,-23.05,false);
addBox(scene,.8,.35,48,M.dark,-23.05,.2,0,false);
addBox(scene,.8,.35,48,M.dark,23.05,.2,0,false);
// High roof framework with bright skylight panels, leaving visual openings.
for(let z=-20;z<=20;z+=10){
 addBox(scene,47,.25,.42,M.steel,0,8.5,z,false);
 const skylight=new THREE.Mesh(new THREE.BoxGeometry(7,.08,4.2),mat(0xb9e8fa,.22,.1,{transparent:true,opacity:.5}));
 skylight.position.set(0,8.36,z+4.7);scene.add(skylight);
}
for(let x=-20;x<=20;x+=10)addBox(scene,.35,8.5,.35,M.white,x,4.2,0,false);
for(let z=-15;z<=15;z+=10){
 const lightGroup=new THREE.Group();lightGroup.position.set(0,7.9,z);scene.add(lightGroup);
 addBox(lightGroup,3,.08,.5,M.white,0,0,0,false);
 const glow=new THREE.PointLight(0xfff1d5,16,14);glow.position.set(0,-.7,0);scene.add(glow);
}
// Decorative wall panels and windows on the back wall.
for(let x=-18;x<=18;x+=6){
 addBox(scene,4.7,2.4,.08,M.glass,x,3.7,-23.13,false);
 addBox(scene,4.8,.12,.18,M.steel,x,2.45,-23.05,false);
}
// Entrance portal at the open front.
addBox(scene,14,.35,.55,M.dark,0,5.6,22.8,false);
addBox(scene,.4,5.5,.55,M.steel,-7,2.8,22.8,false);
addBox(scene,.4,5.5,.55,M.steel,7,2.8,22.8,false);
const entranceSign=labelPlane('WELCOME TO THE MALL',8.5,1.15,'#17324b');entranceSign.position.set(0,5.6,22.48);scene.add(entranceSign);

// Shops face the central aisle; build visible display windows, central entry and shelves.
const shops=[
 {name:'TECH HUB',desc:'Phones, headphones and smart gadgets.',x:-12,z:-9,color:0x3e83d8,products:[['Smartphone',14999,0x26384d],['Headphones',2499,0x3e83d8],['Smart Watch',3999,0x299875],['Mini Speaker',1799,0xe9b85d]]},
 {name:'SNEAKER STREET',desc:'Fresh kicks and everyday footwear.',x:12,z:-9,color:0xd94e59,products:[['Runner Sneakers',3299,0xd94e59],['Classic Shoes',2199,0x263449],['Sport Slides',799,0xe9b85d],['Street Cap',599,0x299875]]},
 {name:'STYLE AVENUE',desc:'Fashion picks for your next look.',x:-12,z:9,color:0x2b9b78,products:[['Denim Jacket',2799,0x377bd1],['Everyday Tee',699,0xf1f1ec],['Backpack',1599,0x956c4d],['Sunglasses',999,0x202631]]},
 {name:'HOME & LIVING',desc:'Small upgrades for your space.',x:12,z:9,color:0xb98743,products:[['Desk Lamp',1199,0xe9b85d],['Coffee Mug',299,0xe0e6e9],['Cushion Set',899,0xd94e59],['Plant Pot',449,0x299875]]}
];
const shopMeshes=[];
function makeShop(s){
 const g=new THREE.Group();scene.add(g);g.position.set(s.x,0,s.z);
 const front=s.z<0?1:-1; // shopfront faces aisle
 const frontZ=front*2.55;
 const color=mat(s.color,.42,.08);
 // Store body and accent fascia.
 addBox(g,8.6,4.8,5.3,M.wall,0,2.4,0,false);
 addBox(g,8.9,.48,5.55,color,0,4.72,0,false);
 // Window sections leave a clear central doorway.
 addBox(g,2.65,2.45,.12,M.glass,-2.55,2.35,front*2.68,false);
 addBox(g,2.65,2.45,.12,M.glass,2.55,2.35,front*2.68,false);
 addBox(g,2.7,.12,.2,M.steel,-2.55,1.12,front*2.7,false);
 addBox(g,2.7,.12,.2,M.steel,2.55,1.12,front*2.7,false);
 addBox(g,.18,2.6,.2,M.dark,-1.2,2.3,front*2.72,false);
 addBox(g,.18,2.6,.2,M.dark,1.2,2.3,front*2.72,false);
 // Door frame and glass door.
 addBox(g,2.15,2.8,.16,M.dark,0,1.55,front*2.72,false);
 addBox(g,1.88,2.52,.08,M.glass,0,1.55,front*2.82,false);
 addBox(g,.06,2.45,.08,M.steel,.85,1.55,front*2.88,false);
 // Front sign with actual readable store name.
 const sign=labelPlane(s.name,6.7,.88,'#'+s.color.toString(16).padStart(6,'0'));
 sign.position.set(0,5.28,front*2.9);g.add(sign);
 addBox(g,8.5,.12,.15,M.dark,0,5.65,front*2.8,false);
 // Interior back wall shelves and products.
 for(let row=0;row<2;row++){
  addBox(g,5.9,.14,.72,M.wood,0,1.05+row*1.25,-1.1,false);
  for(let k=0;k<6;k++){
   const pm=mat(s.products[(k+row)%4][2],.48,.04);
   const h=.42+(k%2)*.16;
   addBox(g,.5,h,.46,pm,-2.55+k*1.02,1.36+row*1.25,-1.1,true);
  }
 }
 // Side wall shelving and warm ceiling lights.
 addBox(g,.18,2.2,2.4,M.wood,-3.7,1.55,-.3,false);
 addBox(g,.18,2.2,2.4,M.wood,3.7,1.55,-.3,false);
 const lamp=new THREE.PointLight(s.color,8,9);lamp.position.set(0,3.8,0);g.add(lamp);
 // Raised entry mat and approach marker.
 addBox(scene,4,.035,1.8,mat(0xd5dce1,.55),s.x,.015,s.z+front*3.9,false);
 const marker=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.07,24),mat(s.color,.4,.08));
 marker.position.set(s.x,.07,s.z+front*4.4);marker.castShadow=false;scene.add(marker);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.67,.035,8,32),mat(0xffffff,.35,.15));
 ring.rotation.x=Math.PI/2;ring.position.set(s.x,.11,s.z+front*4.4);scene.add(ring);
 shopMeshes.push({data:s,front,frontZ:s.z+front*2.9,approachZ:s.z+front*4.4,group:g,marker,ring});
}
shops.forEach(makeShop);

// Benches, planters, shrubs and decorative tall plants.
function plant(x,z,scale=1){
 const pot= new THREE.Mesh(new THREE.CylinderGeometry(.34*scale,.45*scale,.75*scale,12),M.wood);
 pot.position.set(x,.38*scale,z);pot.castShadow=true;scene.add(pot);
 const soil=new THREE.Mesh(new THREE.CylinderGeometry(.31*scale,.31*scale,.04*scale,12),M.black);
 soil.position.set(x,.77*scale,z);scene.add(soil);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(.72*scale,16,12),M.leaf);
 crown.position.set(x,1.45*scale,z);crown.castShadow=true;scene.add(crown);
 for(let a=0;a<3;a++){
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.35*scale,12,8),mat(a===1?0x3aa66d:0x21744d,.75));
  leaf.position.set(x+Math.cos(a*2.1)*.38*scale,1.5*scale+Math.sin(a)*.2*scale,z+Math.sin(a*2.1)*.38*scale);scene.add(leaf);
 }
}
[[-19,-18],[19,-18],[-19,18],[19,18],[-5,-17],[5,-17],[-5,17],[5,17]].forEach((p,i)=>plant(p[0],p[1],i%3===0?1.15:.9));
for(const z of [-4,4]){
 addBox(scene,3,.42,.8,M.wood,0,.42,z,false);
 addBox(scene,3,.12,.88,M.dark,0,.69,z,false);
 for(const x of [-.9,.9])addBox(scene,.12,.5,.65,M.steel,x,.25,z,false);
}
// Simple display mannequins outside fashion shop.
function mannequin(x,z,shirtColor){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 addBox(g,.42,.72,.25,mat(shirtColor,.55),0,1.2,0,true);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),mat(0xd9b18d));head.position.y=1.75;g.add(head);
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.42,3,6),mat(shirtColor));arm.position.set(side*.3,1.22,0);arm.rotation.z=side*.15;g.add(arm);
  addBox(g,.13,.55,.15,M.black,side*.12,.55,0,true);
  addBox(g,.16,.12,.27,M.white,side*.12,.12,-.03,true);
 }
}
mannequin(-15,13,0x377bd1);mannequin(-9,13,0xd94e59);

// Player avatar: separate pivot groups allow smoother walking animation.
const player=new THREE.Group();scene.add(player);player.position.set(0,0,16);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.72,5,10),M.shirt);torso.position.y=1.25;torso.castShadow=true;player.add(torso);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.12,.13,.16,10),M.skin);neck.position.y=1.78;player.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,18,14),M.skin);head.position.y=2.05;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.3,16,10,0,Math.PI*2,0,Math.PI*.58),mat(0x30231e));hair.position.y=2.15;player.add(hair);
const face=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,.02),mat(0x704b3b));face.position.set(0,1.98,.278);player.add(face);
const leftArm=new THREE.Group();leftArm.position.set(-.48,1.52,0);player.add(leftArm);
const rightArm=new THREE.Group();rightArm.position.set(.48,1.52,0);player.add(rightArm);
for(const [arm,side] of [[leftArm,-1],[rightArm,1]]){
 const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.43,4,8),M.shirt);upper.position.y=-.28;upper.rotation.z=side*-.08;arm.add(upper);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),M.skin);hand.position.y=-.58;arm.add(hand);
}
const leftLeg=new THREE.Group();leftLeg.position.set(-.2,.78,0);player.add(leftLeg);
const rightLeg=new THREE.Group();rightLeg.position.set(.2,.78,0);player.add(rightLeg);
for(const [leg,side] of [[leftLeg,-1],[rightLeg,1]]){
 const pants=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.48,4,8),M.pants);pants.position.y=-.24;leg.add(pants);
 const foot=addBox(leg,.28,.14,.42,M.shoe,0,-.53,-.08,true);
}
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.58,24),new THREE.MeshBasicMaterial({color:0x26313e,transparent:true,opacity:.2}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.018;player.add(shadow);

let yaw=0,pitch=-.15,moveX=0,moveY=0,dragging=false,lastX=0,lastY=0,walkT=0;
const joystick=document.getElementById('joystick'),knob=document.getElementById('knob');
function joy(e){
 const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31;const l=Math.hypot(dx,dy);
 if(l>max){dx*=max/l;dy*=max/l}
 moveX=dx/max;moveY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joystick.addEventListener('pointerdown',e=>{joystick.setPointerCapture(e.pointerId);joy(e)});
joystick.addEventListener('pointermove',e=>{if(e.buttons)joy(e)});
function stopJoy(){moveX=moveY=0;knob.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',stopJoy);joystick.addEventListener('pointercancel',stopJoy);
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(dragging&&e.target===renderer.domElement){
  yaw-=(e.clientX-lastX)*.0045;
  pitch=Math.max(-.55,Math.min(.16,pitch+(e.clientY-lastY)*.0025));
  lastX=e.clientX;lastY=e.clientY;
 }
});
function nearestShop(){
 let best=null,dist=1e9;
 for(const sm of shopMeshes){
  const d=Math.hypot(player.position.x-sm.data.x,player.position.z-sm.approachZ);
  if(d<dist){best=sm;dist=d}
 }
 return dist<8?best:null;
}
function showToast(t){
 const el=document.getElementById('toast');el.textContent=t;el.style.display='block';
 clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.display='none',1700);
}
let cart=[],activeShop=null;
function money(n){return '₹'+n.toLocaleString('en-IN')}
function openShop(sm){
 if(!sm){showToast('Walk closer to a shop first');return}
 activeShop=sm.data;
 document.getElementById('shopName').textContent=activeShop.name;
 document.getElementById('shopDesc').textContent=activeShop.desc;
 const items=document.getElementById('items');items.innerHTML='';
 activeShop.products.forEach(([name,price,color])=>{
  const d=document.createElement('div');d.className='item';
  const sw=document.createElement('div');sw.className='swatch';sw.style.background=`linear-gradient(135deg,#${color.toString(16).padStart(6,'0')},#ffffff40)`;d.appendChild(sw);
  const b=document.createElement('b');b.textContent=name;d.appendChild(b);
  const priceEl=document.createElement('span');priceEl.textContent=money(price);d.appendChild(priceEl);
  const add=document.createElement('button');add.textContent='ADD TO CART';
  add.onclick=()=>{cart.push({name,price,shop:activeShop.name});updateCart();showToast(name+' added to cart')};
  d.appendChild(add);items.appendChild(d);
 });
 document.getElementById('shopPanel').style.display='block';
 document.getElementById('cartPanel').style.display='none';
}
function updateCart(){
 const total=cart.reduce((a,b)=>a+b.price,0);
 document.getElementById('cartCount').textContent=cart.length;
 document.getElementById('cartTotal').textContent=money(total);
 document.getElementById('cartGrand').textContent='Total: '+money(total);
 const lines=document.getElementById('cartLines');lines.innerHTML='';
 if(!cart.length){lines.textContent='Your cart is empty.';return}
 cart.forEach((item,i)=>{
  const line=document.createElement('div');line.className='cartline';
  const name=document.createElement('span');name.textContent=item.name+' · '+item.shop;
  const right=document.createElement('span');right.textContent=money(item.price);
  const remove=document.createElement('button');remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.name);
  remove.onclick=()=>{cart.splice(i,1);updateCart()};
  right.appendChild(remove);line.append(name,right);lines.appendChild(line);
 });
}
document.getElementById('interact').onclick=()=>openShop(nearestShop());
document.getElementById('closeShop').onclick=()=>document.getElementById('shopPanel').style.display='none';
document.getElementById('viewBtn').onclick=()=>{yaw=0;pitch=-.15;showToast('View reset')};
document.getElementById('cartToggle').onclick=()=>{
 const panel=document.getElementById('cartPanel');
 panel.style.display=panel.style.display==='block'?'none':'block';
 document.getElementById('shopPanel').style.display='none';
 updateCart();
};
document.getElementById('clearCart').onclick=()=>{cart=[];updateCart();showToast('Cart cleared')};
updateCart();

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(document.getElementById('shopPanel').style.display!=='block'){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const dir=forward.clone().multiplyScalar(-moveY).add(right.multiplyScalar(moveX));
  if(dir.length()>1)dir.normalize();
  if(dir.length()>.05){
   player.position.addScaledVector(dir,dt*3.6);
   player.rotation.y=Math.atan2(dir.x,dir.z);
   walkT+=dt*9;
   leftArm.rotation.x=Math.sin(walkT)*.55;rightArm.rotation.x=-Math.sin(walkT)*.55;
   leftLeg.rotation.x=-Math.sin(walkT)*.55;rightLeg.rotation.x=Math.sin(walkT)*.55;
   torso.position.y=1.25+Math.abs(Math.sin(walkT))*.025;
  }else{
   leftArm.rotation.x*=.8;rightArm.rotation.x*=.8;leftLeg.rotation.x*=.8;rightLeg.rotation.x*=.8;torso.position.y=THREE.MathUtils.lerp(torso.position.y,1.25,.15);
  }
  player.position.x=THREE.MathUtils.clamp(player.position.x,-21,21);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-21,21);
 }
 const target=new THREE.Vector3(player.position.x,1.25,player.position.z);
 const dist=8.3;
 const desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*dist,player.position.y+4.1+pitch*2.5,player.position.z+Math.cos(yaw)*dist);
 camera.position.lerp(desired,.12);camera.lookAt(target);
 const near=nearestShop();
 document.getElementById('interact').textContent=near?'OPEN '+near.data.name:'OPEN NEAREST SHOP';
 document.getElementById('hint').textContent=near?'Near '+near.data.name+' • Tap OPEN SHOP to browse':'Move with joystick • Drag the world to look around • Walk to a shop';
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
animate();
</script>
</body>
</html>
